<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar shadow p-0">
                <div class="sidebar-sticky p-3 d-flex flex-column h-100" style="min-height: 100vh;">
                    <h5 class="mb-4 text-primary">Hospital Name</h5>
                    <ul class="nav flex-column grow">
                        <li class="nav-item mb-2">
                            <a class="nav-link active" href="#dashboard">
                                <a href = "dashboard.html" class="me-2"><i class="bi bi-speedometer2"></i></span>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="#nurses">
                                <a href = "nursesManagement.html"class="me-2"><i class="bi bi-person-badge"></i></span>
                                Nurses
                            </a>
                        </li>
                         <li class="nav-item mb-2">
                            <a class="nav-link" href="#patients">
                                <a href = "PatientList.html" class="me-2"><i class="bi bi-person-rolodex"></i></span>
                                Patients
                                
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="#schedules">
                                <a href="scheduleNurse.html"class="me-2"><i class="bi bi-calendar-event"></i></span>
                                Schedules
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="#reports">
                                <a href="reports.html"class="me-2"><i class="bi bi-bar-chart"></i></span>
                                Reports
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="#settings">
                                <a href="settings.html" class="me-2"><i class="bi bi-gear"></i></span>
                                Settings
                            </a>
                        </li>
                    </ul>
                    <div class="mt-auto">
                        <a class="btn btn-outline-danger w-100" href="#logout">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </div>
                </div>
            </nav>

            <!-- Patient Management Features -->
            <main class="col-md-10 ms-sm-auto px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Patient Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">
                        <i class="bi bi-person-plus"></i> Add Patient
                    </button>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Name</th>
                                        <th>Age</th>
                                        <th>Gender</th>
                                        <th>Condition</th>
                                        <th>Room</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Example patient rows -->
                                    <tr>
                                        <td>1</td>
                                        <td>Jane Doe</td>
                                        <td>45</td>
                                        <td>Female</td>
                                        <td>Stable</td>
                                        <td>101A</td>
                                        <td>
                                            <button class="btn btn-sm btn-info me-1"><i class="bi bi-eye"></i></button>
                                            <button class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>2</td>
                                        <td>John Smith</td>
                                        <td>60</td>
                                        <td>Male</td>
                                        <td>Critical</td>
                                        <td>102B</td>
                                        <td>
                                            <button class="btn btn-sm btn-info me-1"><i class="bi bi-eye"></i></button>
                                            <button class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                    <!-- Add more patient rows as needed -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Patient Modal -->
    <div class="modal fade" id="addPatientModal" tabindex="-1" aria-labelledby="addPatientModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addPatientModalLabel">Add New Patient</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
              <div class="mb-3">
                  <label for="patientName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="patientName" required>
              </div>
              <div class="mb-3">
                  <label for="patientAge" class="form-label">Age</label>
                  <input type="number" class="form-control" id="patientAge" required>
              </div>
              <div class="mb-3">
                  <label for="patientGender" class="form-label">Gender</label>
                  <select class="form-select" id="patientGender" required>
                      <option value="">Select</option>
                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                  </select>
              </div>
              <div class="mb-3">
                  <label for="patientCondition" class="form-label">Condition</label>
                  <input type="text" class="form-control" id="patientCondition" required>
              </div>
              <div class="mb-3">
                  <label for="patientRoom" class="form-label">Room</label>
                  <input type="text" class="form-control" id="patientRoom" required>
              </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Patient</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
